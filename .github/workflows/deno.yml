name: Deso tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js (for Biome)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Biome
        run: npm install --global @biomejs/biome

      - name: Verify formatting
        run: deno fmt --check

      - name: Run Deno linter
        run: deno lint

      - name: Run Biome linter
        run: biome check .

      - name: Check examples compile
        run: |
          for example in examples/*/; do
            if [ -f "$example/main.ts" ]; then
              deno check "$example/main.ts" || exit 1
            fi
          done

      - name: Run tests
        run: deno task test

      - name: Run benchmarks
        run: deno run --allow-all benchmarks.ts
